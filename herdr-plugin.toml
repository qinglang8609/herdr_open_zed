id = "fanchao.open-with-zed"
name = "Open with Zed"
version = "0.3.0"
min_herdr_version = "0.9.5"
description = "Open the current workspace in Zed, or start a TTT tab"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open with Zed"
contexts = ["workspace"]
platforms = ["macos"]
command = ["sh", "scripts/open-zed.sh"]

[[actions]]
id = "ttt"
title = "Open TTT Tab"
contexts = ["workspace"]
command = ["sh", "scripts/open-ttt.sh"]
